[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricepulse"
version = "0.1.0"
description = "Marketplace price monitoring service with Telegram notifications"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Anatolii Bessmertnyy" }
]

dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.13",
    "celery>=5.5",
    "curl-cffi>=0.15.0",
    "fastapi>=0.116",
    "httpx>=0.28",
    "matplotlib>=3.9",
    "parsel>=1.10",
    "Pillow>=10.0",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-telegram-bot>=22.0",
    "python-dotenv>=1.0.0",
    "redis>=6.2",
    "ruff>=0.8",
    "sqlalchemy>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.28",  # For TestClient
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = ["S101", "ARG002", "RUF001", "RUF002", "RUF003", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "DTZ"]
"alembic/*" = ["ARG001", "E501", "E402"]
"app/cli/**/*.py" = ["T201"]
"scripts/**/*.py" = ["T201"]
"app/bot/**/*.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.hatch.build.targets.wheel]
packages = ["app"]
