[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pricepulse"
version = "0.1.0"
description = "Marketplace price monitoring service with Telegram notifications"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Anatolii Bessmertnyy" }
]

dependencies = [
    "fastapi>=0.116",
    "uvicorn[standard]>=0.35",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "redis>=6.2",
    "celery>=5.5",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "parsel>=1.10",
    "python-telegram-bot>=22.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25.4",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.17",
    "pre-commit>=4.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.12"
strict = true

disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
